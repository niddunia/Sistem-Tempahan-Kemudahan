[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  NEXT_VERSION = "16"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  
  # Increase timeout for AI endpoints (can take up to 30s)
  [functions.ai_chat]
    timeout = 30
  
  [functions.ai_parse_booking]
    timeout = 30
  
  [functions.ai_report_summary]
    timeout = 30
